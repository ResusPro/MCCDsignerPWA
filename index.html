<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123b6d">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' blob: data:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="description" content="MCCDSigner v0.8.9 — local-only MCCD orientation, Medical Examiner signing and desktop/mobile workflow.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./assets/app-v0.7.0.css">
  <link rel="stylesheet" href="./assets/workflow-v0.8.9.css">
  <link rel="stylesheet" href="./assets/me-shortcuts-v0.8.9.css">
  <title>MCCDSigner PWA v0.8.9</title>
  <script src="./startup-v0.8.9.js" defer></script>
  <script src="./browser-compat-v0.8.6.js" defer></script>
  <script src="./deskew-v0.8.6.js" defer></script>
  <script type="module" crossorigin src="./assets/app-v0.8.9.js"></script>
  <script src="./workflow-v0.8.9.js" defer></script>
  <script src="./me-shortcuts-v0.8.9.js" defer></script>
</head>
<body>
  <div id="app" aria-live="polite">
    <main>
      <h1>MCCDSigner PWA v0.8.9</h1>
      <p>Loading local document processor…</p>
    </main>
  </div>

  <footer id="me-spreadsheet-shortcuts" aria-label="Medical Examiner spreadsheets">
    <div class="me-links-card">
      <div class="me-links-heading">
        <h2>ME spreadsheets</h2>
        <button id="me-sheet-import" class="secondary compact" type="button">Load / refresh links.txt</button>
      </div>
      <nav aria-label="Open ME spreadsheets">
        <a id="me-sheet-community" aria-disabled="true">Community</a>
        <a id="me-sheet-pgh" aria-disabled="true">PGH</a>
        <a id="me-sheet-rbh" aria-disabled="true">RBH</a>
      </nav>
      <p id="me-sheet-status" class="me-links-status" role="status" aria-live="polite">Load ME_Spreadsheet_Links.txt to enable these links.</p>
      <input id="me-sheet-file" type="file" accept=".txt,text/plain" aria-label="Choose ME_Spreadsheet_Links.txt">
    </div>
  </footer>
</body>
</html>
